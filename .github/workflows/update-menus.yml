name: Update official menus

on:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install updater dependencies
        run: npm ci
      - name: Fetch official menu data
        run: node scripts/update-menus.mjs
      - name: Validate data
        run: node -e "const d=require('./external-menus.json');if(d.items?.length<500)throw Error('nutrition menu data is incomplete');if(d.storeInventory?.length<300)throw Error('Shinyoshida inventory is incomplete');console.log(d.items.length+' nutrition items, '+d.storeInventory.length+' Shinyoshida items')"
      - name: Commit changed menu data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add external-menus.json
          git diff --cached --quiet || git commit -m "Update official menu data"
          git push
